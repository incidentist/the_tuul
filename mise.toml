[tools]
uv = "latest"
pnpm = "12"

[settings]
python.uv_venv_auto = "create|source"

[tasks.install]
description = "Install frontend and backend dependencies"
run = '''
pnpm install
uv lock
uv sync
'''

[tasks.frontend-dev]
description = "Run the Vite frontend dev server"
run = "pnpm dev"

[tasks.backend-dev]
description = "Run the backend dev server with gunicorn (auto-reload via DEBUG)"
run = "DEBUG=true uv run gunicorn --config gunicorn.conf.py api.main:app"

[tasks.dev]
description = "Run frontend and backend dev servers together"
run = "mise run frontend-dev ::: backend-dev"

[tasks.run-api]
description = "Run the backend with gunicorn"
run = "uv run gunicorn --config gunicorn.conf.py api.main:app"

[tasks.format-backend]
description = "Format backend code with black"
run = "uv run black api/"

[tasks.test-api]
description = "Smoke-test that the FastAPI app loads"
run = "uv run python -c \"from api.main import app; print('✅ FastAPI app loads successfully')\""

[tasks.bump-version-minor]
description = "Bump the minor version (via pnpm version, which also bumps the Python version)"
run = "pnpm version minor"

[tasks.bump-version-patch]
description = "Bump the patch version (via pnpm version, which also bumps the Python version)"
run = "pnpm version patch"

[tasks.build-docker]
description = "Build the production Docker image"
run = '''
docker buildx build -t "the-tuul:latest" \
  --cache-from "the-tuul:latest" \
  .
'''

# The three self-hosted flavors. They differ in where audio separation runs;
# cuda also builds its own image. See the Self Hosting section of the README.
#
# Each takes a docker compose subcommand (default `up`) and a --build flag:
#   mise run selfhosted --build     # build, then start
#   mise run selfhosted-cuda        # start
#   mise run selfhosted-cuda down   # stop
#   mise run selfhosted logs

[tasks.selfhosted]
description = "Run the self-hosted stack, CPU only (separates in the container)"
usage = '''
flag "--build" help="Rebuild the image before starting"
arg "<command>" default="up" help="docker compose subcommand (up, down, logs, ps...)"
'''
run = '''
# mise mis-parses `--build <cmd>`, handing both tokens back in
# $usage_command, so pull --build out of the args wherever it ended up.
BUILD=""
ARGS=""
for tok in $usage_command; do
  if [ "$tok" = "--build" ]; then BUILD="--build"; else ARGS="$ARGS $tok"; fi
done
[ "$usage_build" = "true" ] && BUILD="--build"
ARGS="${ARGS# }"
[ -z "$ARGS" ] && ARGS="up"
# --build is only meaningful for `up`.
[ "${ARGS%% *}" = "up" ] || BUILD=""
docker compose -f compose.yaml $ARGS $BUILD
'''

[tasks.selfhosted-cuda]
description = "Run the self-hosted stack with an NVIDIA GPU passed into the container"
usage = '''
flag "--build" help="Rebuild the image before starting"
arg "<command>" default="up" help="docker compose subcommand (up, down, logs, ps...)"
'''
run = '''
# mise mis-parses `--build <cmd>`, handing both tokens back in
# $usage_command, so pull --build out of the args wherever it ended up.
BUILD=""
ARGS=""
for tok in $usage_command; do
  if [ "$tok" = "--build" ]; then BUILD="--build"; else ARGS="$ARGS $tok"; fi
done
[ "$usage_build" = "true" ] && BUILD="--build"
ARGS="${ARGS# }"
[ -z "$ARGS" ] && ARGS="up"
# --build is only meaningful for `up`.
[ "${ARGS%% *}" = "up" ] || BUILD=""
docker compose \
  -f compose.yaml \
  -f compose.cuda.yaml \
  $ARGS $BUILD
'''

[tasks.selfhosted-host-gpu]
description = "Run the self-hosted stack with separation as a host process (use on a Mac)"
usage = '''
flag "--build" help="Rebuild the image before starting"
arg "<command>" default="up" help="docker compose subcommand (up, down, logs, ps...)"
'''
run = '''
# Compose finds the `tuul-separator` provider on PATH; it runs the separator on
# the host, where it can reach a GPU a Linux container cannot (CoreML on a Mac).
# Needs Docker Compose v2.36+ for provider services, and `uv` on the host.
if ! docker compose version --short 2>/dev/null | awk -F. '{ exit !($1 > 2 || ($1 == 2 && $2 >= 36)) }'; then
  echo "This flavor needs Docker Compose v2.36+ for provider services; found $(docker compose version --short 2>/dev/null || echo 'none')." >&2
  exit 1
fi
if ! command -v uv >/dev/null 2>&1; then
  echo "This flavor runs the separator on the host and needs uv: https://docs.astral.sh/uv/getting-started/installation/" >&2
  exit 1
fi

# mise mis-parses `--build <cmd>`, handing both tokens back in
# $usage_command, so pull --build out of the args wherever it ended up.
BUILD=""
ARGS=""
for tok in $usage_command; do
  if [ "$tok" = "--build" ]; then BUILD="--build"; else ARGS="$ARGS $tok"; fi
done
[ "$usage_build" = "true" ] && BUILD="--build"
ARGS="${ARGS# }"
[ -z "$ARGS" ] && ARGS="up"
# --build is only meaningful for `up`.
[ "${ARGS%% *}" = "up" ] || BUILD=""
PATH="$PWD/infra/compose-separation-provider:$PATH" docker compose \
  -f compose.yaml \
  -f compose.host-gpu.yaml \
  $ARGS $BUILD
'''

[tasks.gcs-cors]
description = "Apply infra/gcs/cors.json to the separated-tracks bucket (reads SEPARATED_TRACKS_BUCKET from the env or .env)"
run = '''
BUCKET="${SEPARATED_TRACKS_BUCKET:-$(grep '^SEPARATED_TRACKS_BUCKET=' .env 2>/dev/null | cut -d= -f2-)}"
if [ -z "$BUCKET" ]; then
  echo "SEPARATED_TRACKS_BUCKET is not set (export it or add it to .env)" >&2
  exit 1
fi
gcloud storage buckets update "gs://$BUCKET" --cors-file=infra/gcs/cors.json
'''

[tasks.release]
description = "Merge origin/beta into main, tag it with the project version, and push"
run = '''
VERSION="v$(uv version --short)"

git fetch origin
git branch -f main origin/beta
git branch --set-upstream-to=origin/main main
git tag "$VERSION" main
git push origin main:main
git push origin "$VERSION"

echo "Released $VERSION"
'''
