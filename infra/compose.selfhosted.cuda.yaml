# Overlay: give the app container an NVIDIA GPU, so it separates with CUDA
# inside the container -- no host process, no provider service.
#
#   docker compose -f infra/compose.selfhosted.yaml \
#                  -f infra/compose.selfhosted.cuda.yaml up --build
#
# Requires an NVIDIA GPU, the driver on the host, and the NVIDIA Container
# Toolkit so Docker can expose it:
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
# Nothing here changes the image. On Linux the `selfhosted` dependency group
# already resolves to audio-separator[gpu] -> onnxruntime-gpu, and the CUDA
# runtime libraries (cuBLAS, cuDNN, cuFFT...) arrive with it as nvidia-* pip
# wheels, so the slim image carries its own CUDA userspace. All that is missing
# from the base stack is the device itself, which is what this file adds.
# SEPARATION_METHOD stays `api`: same in-process separation as the CPU-only
# stack, except onnxruntime now finds CUDAExecutionProvider and uses it.
#
# If the GPU is not visible at runtime, onnxruntime falls back to
# CPUExecutionProvider -- separation still succeeds, just at CPU speed. Check
# with:
#   docker compose ... exec app python -c \
#     "import onnxruntime; print(onnxruntime.get_available_providers())"

services:
  app:
    environment:
      # Which host GPUs the CUDA libraries inside the container may use.
      # "all" matches the reservation below; set an index (e.g. "0") to pin one.
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # `count: all` takes every GPU on the host. To pin specific ones,
              # replace this with e.g. `device_ids: ["0"]`.
              count: all
              capabilities: [gpu]
