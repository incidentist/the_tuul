# Overlay: give the app container an NVIDIA GPU, so it separates with CUDA
# inside the container -- no host process, no provider service.
#
#   docker compose -f compose.yaml -f compose.cuda.yaml up --build
#
# Requires an NVIDIA GPU, the driver on the host, and the NVIDIA Container
# Toolkit so Docker can expose it:
# https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
# This builds a different image from the base stack: TORCH_GROUP=cuda installs
# the `cuda` dependency group, i.e. CUDA 13 torch and onnxruntime-gpu. Their
# runtime libraries (cuBLAS, cuDNN, cuFFT...) arrive as nvidia-* pip wheels, so
# the slim image carries its own CUDA userspace and the host only needs the
# driver (580+ for CUDA 13). SEPARATION_METHOD stays `api`: same in-process
# separation as the CPU-only stack, except onnxruntime finds
# CUDAExecutionProvider and torch finds the GPU.
#
# The image is tagged the-tuul:cuda, so it sits alongside the base stack's
# the-tuul:cpu rather than replacing it.
#
# If the GPU is not visible at runtime, onnxruntime falls back to
# CPUExecutionProvider -- separation still succeeds, just at CPU speed. Check
# with:
#   docker compose ... exec app python -c \
#     "import onnxruntime; print(onnxruntime.get_available_providers())"

services:
  app:
    image: the-tuul:cuda
    build:
      args:
        TORCH_GROUP: cuda
    environment:
      # Which host GPUs the CUDA libraries inside the container may use.
      # "all" matches the reservation below; set an index (e.g. "0") to pin one.
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # `count: all` takes every GPU on the host. To pin specific ones,
              # replace this with e.g. `device_ids: ["0"]`.
              count: all
              capabilities: [gpu]
