name: Build and Push Docker Image

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build but do not push)"
        required: false
        default: true
        type: boolean

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      # Persist the pnpm store and uv cache mounts through actions/cache.
      # restore-keys lets a lockfile change start from the previous cache and
      # only download what changed.
      - name: Cache Docker cache mounts
        id: cache-mounts
        uses: actions/cache@v6
        with:
          path: cache-mounts
          key: cache-mounts-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}
          restore-keys: cache-mounts-

      - name: Inject cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          # Must match the mount ids and targets in the Dockerfile.
          cache-map: |
            {
              "cache-mounts/pnpm-store": { "target": "/pnpm/store", "id": "pnpm-store" },
              "cache-mounts/uv-cache": { "target": "/root/.cache/uv", "id": "uv-cache" }
            }
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: incidentist/the-tuul
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !github.event.inputs.dry_run) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TUUL_API_HOSTNAME=
            TUUL_DONATE_URL=https://ko-fi.com/incidentist
