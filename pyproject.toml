[project]
name = "the_tuul"
version = "0.21.0"
description = "Create a good-enough karaoke track for any song in about 10 minutes"
authors = [{ name = "Dan Kurtz", email = "andfurthermore@gmail.com" }]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "audio-separator>=0.44.5,<0.45.0",
    # audio-separator imports audioread (via uvr_lib_v5.spec_utils) but does not
    # declare it; it used to arrive transitively through librosa, which no
    # longer depends on it. Without this, `import audio_separator` raises
    # ModuleNotFoundError -- which _split_song_api catches, silently returning
    # UNSEPARATED audio. Declare it ourselves until upstream does.
    "audioread>=3.0.0",
    # audio-separator depends on librosa without a ceiling, but calls
    # librosa.get_duration(filename=...), a keyword librosa 1.0 removed. Left
    # unpinned, uv resolves 1.0.0 and every separation dies with
    # "get_duration() got an unexpected keyword argument 'filename'". Cap it
    # until audio-separator moves to the `path=` spelling.
    "librosa<1.0",
    "pytubefix>=11.2.0,<12.0.0",
    "google-cloud-storage>=3.13.0,<4.0.0",
    "fastapi[standard]>=0.141.1,<0.142.0",
    "gunicorn>=26.0.0,<27.0.0",
    "structlog>=26.1.0,<27.0.0",
    "httpx2>=2.9.1,<3.0.0",
]

[project.scripts]
separator-daemon = "api.run_separator_daemon:main"

[dependency-groups]
# Exactly one of `cpu` / `cuda` is installed; they pick which torch and
# onnxruntime wheels audio-separator runs on. `cpu` is a default group, so a
# plain `uv sync` gets it; for CUDA use `uv sync --no-default-groups --group cuda`.
#
# This matters for image size. PyPI's Linux torch wheel depends on the whole
# CUDA stack (cuDNN, cuBLAS, NCCL...), several GB that a CPU-only box never
# touches. The sources below pull torch from PyTorch's own CPU or CUDA index
# instead.
#
# On macOS both groups resolve to PyPI's torch and plain onnxruntime, which
# ships CoreMLExecutionProvider -- the Apple GPU/ANE path. audio-separator
# autodetects at runtime (setup_torch_device) and picks CUDA, then CoreML, then
# DirectML, falling back to CPU if none are present.
cpu = [
    "torch>=2.13.0,<2.14.0",
    # Pulled in by onnx2torch. It must come from the same index as torch: PyPI's
    # build against CPU torch fails at import with
    # "operator torchvision::nms does not exist".
    "torchvision>=0.28.0,<0.29.0",
    # audio-separator[cpu] only pulls onnxruntime on macOS, leaving Linux with
    # no ONNX runtime at all, so name it ourselves.
    "onnxruntime>=1.29.0,<2.0.0",
]
cuda = [
    "torch>=2.13.0,<2.14.0",
    "torchvision>=0.28.0,<0.29.0",
    # CUDA 13 build; its cuda/cudnn extras are the same nvidia-* wheels torch
    # cu130 pulls, so the two share one CUDA userspace.
    "onnxruntime-gpu[cuda,cudnn]>=1.30.0,<1.31.0; sys_platform != 'darwin'",
    "onnxruntime>=1.29.0,<2.0.0; sys_platform == 'darwin'",
]

dev = ["black>=26.5.1,<27.0.0", "pytest>=9.1.1,<10.0.0", "mypy>=2.3.0,<3.0.0"]

[tool.uv]
package = false
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", group = "cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", group = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/api"]
pythonpath = [".", "api"]

[tool.mypy]
