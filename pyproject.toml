[tool.poetry]
name = "the_tuul"
version = "0.17.0"
description = "Create a good-enough karaoke track for any song in about 10 minutes"
authors = ["Dan Kurtz  <andfurthermore@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
audio-separator = {extras = ["cpu"], version = "^0.44.5"}
pytubefix = "^10.11.0"
google-cloud-storage = "^3.13.0"
fastapi = {extras = ["standard"], version = "^0.141.1"}
gunicorn = "^26.0.0"
structlog = "^26.1.0"
httpx2 = "^2.9.1"

[tool.poetry.scripts]
separator-daemon = "api.run_separator_daemon:main"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pytest = "^9.1.1"
mypy = "^2.3.0"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests/api",
]
pythonpath = [
  ".",
  "api"
]

[tool.mypy]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
