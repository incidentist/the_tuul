[project]
name = "the_tuul"
version = "0.19.1"
description = "Create a good-enough karaoke track for any song in about 10 minutes"
authors = [{ name = "Dan Kurtz", email = "andfurthermore@gmail.com" }]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "audio-separator[cpu]>=0.44.5,<0.45.0",
    "pytubefix>=10.11.0,<11.0.0",
    "google-cloud-storage>=3.13.0,<4.0.0",
    "fastapi[standard]>=0.141.1,<0.142.0",
    "gunicorn>=26.0.0,<27.0.0",
    "structlog>=26.1.0,<27.0.0",
    "httpx2>=2.9.1,<3.0.0",
]

[project.scripts]
separator-daemon = "api.run_separator_daemon:main"

[dependency-groups]
dev = [
    "black>=26.5.1,<27.0.0",
    "pytest>=9.1.1,<10.0.0",
    "mypy>=2.3.0,<3.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/api"]
pythonpath = [".", "api"]

[tool.mypy]
